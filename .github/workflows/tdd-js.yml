name: TDD JS

on:
  push:
    branches:
      - feat/m01-foundation-tooling

permissions:
  contents: read

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:js -- --runInBand
