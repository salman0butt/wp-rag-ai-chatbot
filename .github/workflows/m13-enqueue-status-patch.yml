name: M13 enqueue status patch
on:
  push:
    branches: [feat/m13-knowledge-manager-debugger]
    paths: [.github/workflows/m13-enqueue-status-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m13-knowledge-manager-debugger
      - name: Reconcile durable status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/progress/STATUS.md')
          text = path.read_text()
          marker = "\n## Current work\n"
          section = """

Completed bounded slice — Task 3 enqueue lifecycle UI integration:

- Top-level Knowledge now exposes a labelled native enqueue form for the existing Task 3 identifier-only payload: `document_key`, numeric `source_id`, `collection_id`, `configuration_id`, and `generation`.
- Enqueue reuses the existing nonce-authenticated `POST /admin/knowledge/jobs` contract, then refetches `GET /admin/knowledge/jobs?page=1&per_page=20` before rerendering; no optimistic queue state is retained.
- Browser state does not add source config, credentials, raw documents, raw provider payloads, queue payload internals, idempotency keys, or lease/lock data.
- Initial test checkpoint required formatting before behavioral verification and is not counted as RED.
- Genuine RED `99ff3bea50c89df4ec135852932c0529894b3fe4` / probe `34326208932`: engines, package lint, JavaScript lint, and TypeScript all passed; the enqueue-specific Jest step alone failed because the enqueue form/action was absent.
- GREEN implementation `a0f185bd3b17f62833d6e799e16bafacbfd32f54`: the full `npm run verify:js` gate passed before commit.
- Clean implementation head `38e44dd72246713bbe97bfb0deb3a79749c01843` / CI `34326516720`: `php-quality`, `js-quality`, `package`, and complete `wordpress-smoke` all GREEN.
- Scoped correctness/security/accessibility/performance review: 0 Critical / 0 Important. Independent reviewer-subagent transport remains unavailable, so final Task 4 independent closeout review remains outstanding.
- Evidence: `docs/progress/M13-TASK4-KNOWLEDGE-JOB-ENQUEUE.md`.
"""
          if section.strip() not in text:
              if marker not in text:
                  raise SystemExit('Current work marker not found')
              text = text.replace(marker, section + marker, 1)
          old = """Exact continuation:\n\n- start with a fresh genuine Jest RED for the existing Task 3 enqueue contract `POST /admin/knowledge/jobs`, without changing the server contract;\n- after enqueue GREEN, add a separate RED/GREEN for stable `invalid_transition` presentation and sanitized mutation errors without raw exception/provider payloads;"""
          new = """Exact continuation:\n\n- start with a fresh genuine Jest RED for stable `invalid_transition` presentation and sanitized enqueue/cancel/retry mutation errors without raw exception/provider payloads;"""
          if old not in text:
              raise SystemExit('Exact continuation block not found')
          text = text.replace(old, new, 1)
          durable = "- `docs/progress/M13-TASK4-KNOWLEDGE-JOB-ACTIONS.md` — Task 4 cancel/retry lifecycle UI evidence.\n"
          addition = durable + "- `docs/progress/M13-TASK4-KNOWLEDGE-JOB-ENQUEUE.md` — Task 4 enqueue lifecycle UI evidence.\n"
          if "M13-TASK4-KNOWLEDGE-JOB-ENQUEUE.md` — Task 4 enqueue" not in text:
              if durable not in text:
                  raise SystemExit('Durable recovery anchor not found')
              text = text.replace(durable, addition, 1)
          path.write_text(text)
          PY
      - name: Remove patch workflow
        run: rm .github/workflows/m13-enqueue-status-patch.yml
      - name: Commit status reconciliation
        run: |
          git config user.name 'Salman Butt'
          git config user.email '47062638+salman0butt@users.noreply.github.com'
          git add docs/progress/STATUS.md .github/workflows/m13-enqueue-status-patch.yml
          git commit -m 'docs(m13): record knowledge job enqueue slice'
          git push origin HEAD:feat/m13-knowledge-manager-debugger
