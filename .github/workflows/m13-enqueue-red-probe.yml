name: M13 enqueue RED probe
on:
  push:
    branches: [feat/m13-knowledge-manager-debugger]
    paths: [.github/workflows/m13-enqueue-red-probe.yml]
permissions:
  contents: read
jobs:
  verify-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check engines
        run: npm run check-engines
      - name: Lint package
        run: npm run lint:pkg
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Typecheck
        run: npm run typecheck
      - name: Verify enqueue behavior RED
        run: npm run test:js -- --runInBand src-js/knowledge-job-enqueue.test.ts
