# One-shot guarded production patch. This file deletes itself after GREEN verification.
name: M13 Knowledge Navigation Race Patch

on:
  push:
    branches:
      - feat/m13-knowledge-manager-debugger
    paths:
      - .github/workflows/m13-knowledge-navigation-race-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m13-knowledge-manager-debugger
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Guard and patch latest-request-wins navigation
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src-js/index.ts')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "\tlet loadedKnowledgeSourceId: string | undefined;\n\tlet loadedKnowledgeDocumentKey: string | undefined;",
              "\tlet loadedKnowledgeSourceId: string | undefined;\n\tlet loadedKnowledgeDocumentKey: string | undefined;\n\tlet knowledgeSelectionGeneration = 0;",
          )

          old = '''\tconst refreshKnowledgeDetail = async (\n\t\tsourceId: string\n\t): Promise< void > => {\n\t\tconst encodedSourceId = encodeURIComponent( sourceId );\n\t\tcurrentKnowledgeDetail = await client.request< KnowledgeSourceDetail >(\n\t\t\t`/admin/knowledge/sources/${ encodedSourceId }`\n\t\t);\n\t\tcurrentKnowledgeDocuments =\n\t\t\tawait client.request< KnowledgeDocumentPage >(\n\t\t\t\t`/admin/knowledge/sources/${ encodedSourceId }/documents?page=1&per_page=20`\n\t\t\t);\n\t\tloadedKnowledgeSourceId = sourceId;\n\t};\n\tconst refreshKnowledgeChunks = async (\n\t\tsourceId: string,\n\t\tdocumentKey: string\n\t): Promise< void > => {\n\t\tcurrentKnowledgeChunks = await client.request< KnowledgeChunkPage >(\n\t\t\t`/admin/knowledge/sources/${ encodeURIComponent(\n\t\t\t\tsourceId\n\t\t\t) }/documents/${ encodeURIComponent(\n\t\t\t\tdocumentKey\n\t\t\t) }/chunks?page=1&per_page=20`\n\t\t);\n\t\tloadedKnowledgeDocumentKey = documentKey;\n\t};\n\tconst refreshKnowledgeSelection = async (\n\t\tsourceId: string\n\t): Promise< void > => {\n\t\tawait refreshKnowledgeDetail( sourceId );\n\t\tconst documentKey = resolveSelectedKnowledgeDocumentKey(\n\t\t\tcurrentHash()\n\t\t);\n\n\t\tif ( documentKey !== undefined ) {\n\t\t\tawait refreshKnowledgeChunks( sourceId, documentKey );\n\t\t}\n\t};'''

          new = '''\tconst refreshKnowledgeDetail = async (\n\t\tsourceId: string\n\t): Promise< {\n\t\tdetail: KnowledgeSourceDetail;\n\t\tdocuments: KnowledgeDocumentPage;\n\t} > => {\n\t\tconst encodedSourceId = encodeURIComponent( sourceId );\n\t\tconst detail = await client.request< KnowledgeSourceDetail >(\n\t\t\t`/admin/knowledge/sources/${ encodedSourceId }`\n\t\t);\n\t\tconst documents = await client.request< KnowledgeDocumentPage >(\n\t\t\t`/admin/knowledge/sources/${ encodedSourceId }/documents?page=1&per_page=20`\n\t\t);\n\n\t\treturn { detail, documents };\n\t};\n\tconst refreshKnowledgeChunks = async (\n\t\tsourceId: string,\n\t\tdocumentKey: string,\n\t\trequestGeneration = knowledgeSelectionGeneration\n\t): Promise< boolean > => {\n\t\tconst chunks = await client.request< KnowledgeChunkPage >(\n\t\t\t`/admin/knowledge/sources/${ encodeURIComponent(\n\t\t\t\tsourceId\n\t\t\t) }/documents/${ encodeURIComponent(\n\t\t\t\tdocumentKey\n\t\t\t) }/chunks?page=1&per_page=20`\n\t\t);\n\n\t\tif (\n\t\t\trequestGeneration !== knowledgeSelectionGeneration ||\n\t\t\tresolveSelectedPersistedKnowledgeSourceId( currentHash() ) !==\n\t\t\t\tsourceId ||\n\t\t\tresolveSelectedKnowledgeDocumentKey( currentHash() ) !== documentKey\n\t\t) {\n\t\t\treturn false;\n\t\t}\n\n\t\tcurrentKnowledgeChunks = chunks;\n\t\tloadedKnowledgeDocumentKey = documentKey;\n\t\treturn true;\n\t};\n\tconst refreshKnowledgeSelection = async (\n\t\tsourceId: string\n\t): Promise< boolean > => {\n\t\tconst requestGeneration = ++knowledgeSelectionGeneration;\n\n\t\ttry {\n\t\t\tconst { detail, documents } = await refreshKnowledgeDetail( sourceId );\n\n\t\t\tif (\n\t\t\t\trequestGeneration !== knowledgeSelectionGeneration ||\n\t\t\t\tresolveSelectedPersistedKnowledgeSourceId( currentHash() ) !==\n\t\t\t\t\tsourceId\n\t\t\t) {\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\tcurrentKnowledgeDetail = detail;\n\t\t\tcurrentKnowledgeDocuments = documents;\n\t\t\tloadedKnowledgeSourceId = sourceId;\n\n\t\t\tconst documentKey = resolveSelectedKnowledgeDocumentKey(\n\t\t\t\tcurrentHash()\n\t\t\t);\n\n\t\t\tif ( documentKey !== undefined ) {\n\t\t\t\treturn refreshKnowledgeChunks(\n\t\t\t\t\tsourceId,\n\t\t\t\t\tdocumentKey,\n\t\t\t\t\trequestGeneration\n\t\t\t\t);\n\t\t\t}\n\n\t\t\tcurrentKnowledgeChunks = undefined;\n\t\t\tloadedKnowledgeDocumentKey = undefined;\n\t\t\treturn true;\n\t\t} catch ( error ) {\n\t\t\tif ( requestGeneration !== knowledgeSelectionGeneration ) {\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\tthrow error;\n\t\t}\n\t};'''

          replace_once(old, new)

          replace_once(
              "\t\tif ( screen !== 'knowledge' ) {\n\t\t\tcurrentKnowledgePage = undefined;",
              "\t\tif ( screen !== 'knowledge' ) {\n\t\t\tknowledgeSelectionGeneration += 1;\n\t\t\tcurrentKnowledgePage = undefined;",
          )

          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/m13-knowledge-navigation-race-patch.yml
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Format patched JavaScript
        run: npx wp-scripts lint-js src-js/index.ts --fix
      - name: Verify JavaScript GREEN
        run: npm run verify:js
      - name: Commit verified production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-js/index.ts .github/workflows/m13-knowledge-navigation-race-patch.yml
          git commit -m "fix(m13): keep newest knowledge navigation authoritative"
          git push origin HEAD:feat/m13-knowledge-manager-debugger
