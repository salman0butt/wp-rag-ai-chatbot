name: Task 4 Composer Lock

on:
  push:
    branches:
      - feat/m05-file-document-ingestion

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Resolve parser dependencies
        run: |
          composer require --no-update 'smalot/pdfparser:^2.12.5' 'phpoffice/phpword:^1.4'
          composer update smalot/pdfparser phpoffice/phpword --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Commit resolved dependency files when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: lock Task 4 parser dependencies'
          git push origin HEAD:feat/m05-file-document-ingestion
