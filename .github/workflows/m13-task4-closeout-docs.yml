name: M13 Task 4 closeout docs

on:
  push:
    branches:
      - feat/m13-knowledge-manager-debugger
    paths:
      - .github/workflows/m13-task4-closeout-docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m13-knowledge-manager-debugger
          fetch-depth: 2
      - name: Guard exact evidence parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "76703316d95929488843b876d07a9a3c9136858c"
      - name: Reconcile milestone and status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          milestone = Path('docs/milestones/M13-knowledge-manager-playground-debugger.md')
          text = milestone.read_text()
          replacements = {
              "Status: IN PROGRESS — Tasks 1-3 COMPLETE; Task 4 IMPLEMENTED / CLOSEOUT ACTIVE":
                  "Status: IN PROGRESS — Tasks 1-4 COMPLETE; Task 5 NEXT",
              "4. **Knowledge manager admin UI — IMPLEMENTED; CLOSEOUT ACTIVE.** The existing nonce-authenticated admin client now consumes Tasks 1-3 with bounded server-authoritative source/detail/document/chunk/job state; enqueue/cancel/retry; safe stable mutation errors; explicit loading/empty/error states; responsive/long-content and keyboard-accessible navigation; and latest-request-wins async selection correlation. All planned Task 4 behavior has verified RED/GREEN evidence. Final independent Task 4 review is still mandatory before this task is marked COMPLETE. Evidence is in the `docs/progress/M13-TASK4-*` records, including `M13-TASK4-KNOWLEDGE-NAVIGATION-RACE.md`.":
                  "4. **Knowledge manager admin UI — COMPLETE.** The existing nonce-authenticated admin client consumes Tasks 1-3 with bounded server-authoritative source/detail/document/chunk/job state; enqueue/cancel/retry; safe stable mutation errors; explicit loading/empty/error states; responsive/long-content and keyboard-accessible navigation; latest-request-wins source/detail/document/chunk selection; and latest-request-wins bounded source-page pagination. Fresh-session independent closeout review `5158649984` found one Important page-navigation race, resolved under genuine RED → GREEN evidence with 0 Critical / 0 Important unresolved. Evidence is in the `docs/progress/M13-TASK4-*` records, including `M13-TASK4-KNOWLEDGE-NAVIGATION-RACE.md` and `M13-TASK4-KNOWLEDGE-PAGE-RACE.md`.",
              "- Final Task 4 async-navigation race RED `e0d6332cf85b64dd07e108c488e79746a8bc00b9`, CI `34361171785`: lint/typecheck passed; Jest 26 suites / 63 tests with exactly one expected latest-selection failure. Production implementation `fab6a157bdeb3ef8095d0780a7980ea104b8ff88` makes the newest Knowledge route authoritative. Exact branch head `caba788276ce1c05ab042046e0f3032038e57f79`, CI `34361588728`, passed all four permanent jobs with Jest 26/26 suites and 63/63 tests GREEN.":
                  "- Task 4 selected-route async-navigation race RED `e0d6332cf85b64dd07e108c488e79746a8bc00b9`, CI `34361171785`: lint/typecheck passed; Jest 26 suites / 63 tests with exactly one expected latest-selection failure. Production implementation `fab6a157bdeb3ef8095d0780a7980ea104b8ff88` makes the newest selected Knowledge route authoritative. Exact branch head `caba788276ce1c05ab042046e0f3032038e57f79`, CI `34361588728`, passed all four permanent jobs with Jest 26/26 suites and 63/63 tests GREEN.\n- Task 4 final page-navigation combined genuine RED `1caa472ed8da7cba4fb76d05bdf38e099800bc13`, CI `34392061167`: lint/typecheck passed; Jest 28 suites / 65 tests with exactly two expected failures (stale page success overwrite and stale page failure forcing error). Production fix `73875144415582b9b77793498840cfa88595c301`; guarded runner `34392453519` passed full JavaScript verification with 28/28 suites and 65/65 tests GREEN before committing the fix.",
              "- Task 4 scoped reviews record 0 unresolved Critical / 0 Important across its completed slices. The final independent Task 4 closeout review remains outstanding because the independent reviewer transport is transiently unavailable; no independent result is claimed.":
                  "- Fresh-session independent Task 4 closeout review `5158649984`: 1 Important page-navigation race found and resolved under genuine RED → GREEN; 0 Critical / 0 Important unresolved. Admin capability, safe allow-lists, sanitized error boundaries, bounded reads, constant-time request correlation, and UI accessibility semantics remain intact.",
              "Task 4 uses native links/buttons/forms, selected-state `aria-current`, labelled pagination/form controls, `role=\"status\"`/polite live loading feedback, `role=\"alert\"` safe error feedback, mobile-friendly targets, and responsive long-content handling. Final independent Task 4 accessibility review remains mandatory. Task 7 and final M13 closeout require another accessibility pass.":
                  "Task 4 uses native links/buttons/forms, selected-state `aria-current`, labelled pagination/form controls, `role=\"status\"`/polite live loading feedback, `role=\"alert\"` safe error feedback, mobile-friendly targets, and responsive long-content handling. Fresh-session independent review `5158649984` found no unresolved accessibility issue. Task 7 and final M13 closeout require another accessibility pass.",
              "Task 1: no blocking findings. Task 2: one Important UTF-8 truncation boundary issue resolved before closeout; no Critical/Important findings remain unresolved. Task 3: no Critical/Important findings. Task 4 scoped coordinator reviews: no unresolved Critical/Important finding; final independent review pending.":
                  "Task 1: no blocking findings. Task 2: one Important UTF-8 truncation boundary issue resolved before closeout; no Critical/Important findings remain unresolved. Task 3: no Critical/Important findings. Fresh-session independent Task 4 closeout review `5158649984` found one Important top-level page-navigation race; `73875144415582b9b77793498840cfa88595c301` resolves it with 0 Critical / 0 Important unresolved.",
              "Task 2 replaced unsafe raw byte-boundary chunk truncation with UTF-8-safe trailing-byte correction after a genuine failing regression test. Task 3 corrected one impossible REST request null check and reconciled only stale aggregate route-count harness expectations after production routing was introduced. Task 4 latest-request-wins correlation prevents stale source/document/chunk responses from overwriting a newer hash selection.":
                  "Task 2 replaced unsafe raw byte-boundary chunk truncation with UTF-8-safe trailing-byte correction after a genuine failing regression test. Task 3 corrected one impossible REST request null check and reconciled only stale aggregate route-count harness expectations after production routing was introduced. Task 4 latest-request-wins correlation prevents stale source/document/chunk responses and stale top-level source-page successes/failures from overwriting a newer hash-selected state.",
              "Task 4 cannot be marked COMPLETE until its mandatory independent closeout review succeeds. Tasks 5-8 remain unfinished; M13 is not merge-ready.":
                  "Tasks 5-8 remain unfinished; M13 is not merge-ready. Task 5 structured debug-trace projection/redaction is the next unfinished unit.",
              "Incomplete. Final Task 4 independent review, Tasks 5-8, final milestone review, exact-final-head CI, merge and post-merge main verification remain mandatory.":
                  "Incomplete. Task 4 is complete. Tasks 5-8, final milestone review, exact-final-head CI, merge and post-merge main verification remain mandatory."
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          milestone.write_text(text)

          status = Path('docs/progress/STATUS.md')
          text = status.read_text()
          replacements = {
              "### Task 4 — Knowledge manager admin UI: IMPLEMENTED / CLOSEOUT ACTIVE":
                  "### Task 4 — Knowledge manager admin UI: COMPLETE",
              "Scoped Task 4 coordinator reviews currently have **0 unresolved Critical / 0 Important** and PR #18 has no unresolved inline review threads. The mandatory final independent Task 4 review has not succeeded because the independent reviewer transport remains transiently unavailable; no independent result is claimed.":
                  "Fresh-session independent Task 4 closeout review `5158649984` found one Important top-level source-page navigation race and resolved it under genuine RED → GREEN. Final Task 4 review state is **0 Critical / 0 Important unresolved** and PR #18 has no unresolved inline review threads. The page-level race evidence is `docs/progress/M13-TASK4-KNOWLEDGE-PAGE-RACE.md`.",
              "## Current work\n\n**Task 4 — Knowledge manager admin UI closeout** remains the authoritative unfinished unit.\n\nAll planned Task 4 behavioral slices are implemented with genuine RED/GREEN evidence. Exact continuation:\n\n- obtain the mandatory independent Task 4 correctness/security/performance/accessibility review over the complete UI surface, including latest-request-wins navigation;\n- resolve every Critical/Important finding under fresh RED -> GREEN evidence if any are found;\n- require all four permanent CI jobs GREEN on the exact final Task 4 SHA;\n- mark Task 4 COMPLETE only after those gates succeed;\n- only then begin Task 5 with a fresh RED for structured retrieval `DebugTrace` projection/redaction. Never serialize credentials, raw provider payloads, arbitrary upstream errors, unrestricted metadata, or unbounded chunk/candidate data.":
                  "## Current work\n\n**Task 5 — Structured debug trace projection and redaction** is the authoritative next unfinished unit.\n\nTask 4 is complete after fresh-session independent review `5158649984` found and resolved one Important top-level source-page race with 0 Critical / 0 Important unresolved. Exact continuation:\n\n- begin Task 5 with a fresh genuine RED for structured retrieval `DebugTrace` projection/redaction;\n- use explicit allow-lists and hard bounds for trace/candidate/chunk diagnostic fields;\n- never serialize credentials, raw provider payloads, arbitrary upstream errors, unrestricted metadata, or unbounded chunk/candidate data;\n- reuse existing retrieval/domain seams rather than creating a parallel retrieval implementation."
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)

          anchor = "- Evidence: `docs/progress/M13-TASK4-KNOWLEDGE-NAVIGATION-RACE.md`.\n"
          addition = """- Evidence: `docs/progress/M13-TASK4-KNOWLEDGE-NAVIGATION-RACE.md`.\n\nCompleted bounded slice — latest-request-wins top-level Knowledge source pagination:\n\n- A separate page-generation/current-route guard prevents stale bounded source-page successes from overwriting a newer hash-selected page and suppresses stale page failures after a newer page succeeds.\n- Genuine stale-success RED `78db64a04c4e960b377a7bb180d69402c8f0431b` / CI `34391739460`: lint/typecheck passed; Jest 27 suites / 64 tests with exactly one intended failure.\n- Combined genuine RED `1caa472ed8da7cba4fb76d05bdf38e099800bc13` / CI `34392061167`: lint/typecheck passed; Jest 28 suites / 65 tests with exactly two intended failures.\n- Production fix `73875144415582b9b77793498840cfa88595c301`; guarded GREEN runner `34392453519`: full `npm run verify:js`, Jest 28/28 suites / 65/65 tests, build and live-gating GREEN.\n- Fresh-session independent closeout review `5158649984`: one Important page race found/resolved; 0 Critical / 0 Important unresolved.\n- Evidence: `docs/progress/M13-TASK4-KNOWLEDGE-PAGE-RACE.md`.\n"""
          assert anchor in text
          text = text.replace(anchor, addition, 1)

          recovery_anchor = "- `docs/progress/M13-TASK4-KNOWLEDGE-NAVIGATION-RACE.md` — latest-request-wins async navigation evidence.\n"
          assert recovery_anchor in text
          text = text.replace(
              recovery_anchor,
              recovery_anchor + "- `docs/progress/M13-TASK4-KNOWLEDGE-PAGE-RACE.md` — latest-request-wins top-level source-page evidence and independent closeout review.\n",
              1,
          )
          status.write_text(text)
          PY
          git diff --check
      - name: Commit reconciled ledgers and remove runner
        run: |
          set -euo pipefail
          rm .github/workflows/m13-task4-closeout-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/milestones/M13-knowledge-manager-playground-debugger.md docs/progress/STATUS.md .github/workflows/m13-task4-closeout-docs.yml
          git commit -m "docs(m13): mark Task 4 complete"
          git push origin HEAD:feat/m13-knowledge-manager-debugger
