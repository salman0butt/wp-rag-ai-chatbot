name: M16 detail bootstrap patch helper v5

on:
  push:
    branches:
      - feat/m16-conversations-leads-feedback-forms
    paths:
      - .github/workflows/m16-detail-bootstrap-patch-v5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse exact source patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/m16-detail-bootstrap-patch-v3.yml').read_text().splitlines()
          marker = '      - name: Apply exact conversation detail bootstrap patch'
          start = workflow.index(marker)
          run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |')
          body = []
          for line in workflow[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          exec('\n'.join(body), {'__name__': '__main__'})

      - name: Format and verify focused JavaScript gates
        run: |
          npm ci
          npx prettier --write src-js/index.ts src-js/conversation-admin-bootstrap.test.ts
          npx prettier --check src-js/index.ts src-js/conversation-admin-bootstrap.test.ts
          npm run test:js -- --runInBand src-js/conversation-admin-bootstrap.test.ts

      - name: Commit implementation and remove temporary helpers
        run: |
          git config user.name "Salman Butt"
          git config user.email "47062638+salman0butt@users.noreply.github.com"
          git rm .github/workflows/m16-detail-bootstrap-patch.yml
          git rm .github/workflows/m16-detail-bootstrap-patch-v2.yml
          git rm .github/workflows/m16-detail-bootstrap-patch-v3.yml
          git rm .github/workflows/m16-detail-bootstrap-patch-v4.yml
          git rm .github/workflows/m16-detail-bootstrap-patch-v5.yml
          git add src-js/index.ts src-js/conversation-admin-bootstrap.test.ts
          git diff --cached --check
          git commit -m "feat: load conversation detail during admin bootstrap"
          git push origin HEAD:feat/m16-conversations-leads-feedback-forms
