name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: composer verify:php

  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run verify:js
      - run: npm run test:provider:live-gating

  wordpress-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npm run env:start
      - run: npm run test:wp:activation
      - run: npm run test:wp:database
      - run: npm run test:wp:providers
      - if: always()
        run: npm run env:stop

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip -- --root-folder=wp-rag-ai-chatbot
      - run: bash scripts/assert-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wp-rag-ai-chatbot
          path: wp-rag-ai-chatbot.zip
