name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer verify:php
      - run: composer audit

  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --audit-level=critical 2>&1)"
            audit_status=$?
            set -e

            printf '%s\n' "$audit_output"

            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if ! printf '%s\n' "$audit_output" | grep -Eq '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              exit "$audit_status"
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "npm audit registry service remained unavailable after 3 attempts." >&2
              exit "$audit_status"
            fi

            echo "npm audit registry service unavailable; retrying attempt $((attempt + 1))/3." >&2
            sleep $((attempt * 10))
          done
      - run: npm run verify:js
      - run: npm run test:provider:live-gating
      - run: npm run test:package:assertion

  wordpress-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npm run env:start
      - run: npm run test:wp:activation
      - run: npm run test:wp:database
      - run: npm run test:wp:providers
      - run: npm run test:wp:knowledge
      - run: npm run test:wp:file-ingestion
      - run: npm run test:wp:woocommerce-knowledge
      - if: always()
        run: npm run env:stop

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip -- --root-folder=wp-rag-ai-chatbot
      - run: bash scripts/assert-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wp-rag-ai-chatbot
          path: wp-rag-ai-chatbot.zip
