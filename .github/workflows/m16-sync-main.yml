name: M16 sync main

on:
  push:
    branches:
      - feat/m16-conversations-leads-feedback-forms
    paths:
      - .github/workflows/m16-sync-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge current main into M16
        run: |
          git config user.name "Salman Butt"
          git config user.email "47062638+salman0butt@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          git rm .github/workflows/m16-sync-main.yml
          git commit -m "chore: remove one-shot M16 main sync workflow"
          git push origin HEAD:feat/m16-conversations-leads-feedback-forms
