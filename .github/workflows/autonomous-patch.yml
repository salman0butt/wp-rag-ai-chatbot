name: Autonomous one-shot patch

on:
  push:
    branches:
      - feat/m13-knowledge-manager-debugger
    paths:
      - .github/workflows/autonomous-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m13-knowledge-manager-debugger
          fetch-depth: 0
      - name: Apply verified Playground navigation seam
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-js/index.ts')
          text = path.read_text()
          old_type = "export type AdminScreen = 'onboarding' | 'bots' | 'providers' | 'knowledge';"
          new_type = "export type AdminScreen =\n\t| 'onboarding'\n\t| 'bots'\n\t| 'providers'\n\t| 'knowledge'\n\t| 'playground';"
          if text.count(old_type) != 1:
              raise SystemExit('AdminScreen authority did not match exactly once')
          text = text.replace(old_type, new_type)

          old_screens = "\t{ screen: 'providers', label: 'Providers' },\n\t{ screen: 'knowledge', label: 'Knowledge' },\n];"
          new_screens = "\t{ screen: 'providers', label: 'Providers' },\n\t{ screen: 'knowledge', label: 'Knowledge' },\n\t{ screen: 'playground', label: 'Playground' },\n];"
          if text.count(old_screens) != 1:
              raise SystemExit('ADMIN_SCREENS authority did not match exactly once')
          path.write_text(text.replace(old_screens, new_screens))
          PY
          git rm .github/workflows/autonomous-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-js/index.ts
          git diff --cached --check
          git commit -m 'feat: add playground admin navigation'
          git push origin HEAD:feat/m13-knowledge-manager-debugger
