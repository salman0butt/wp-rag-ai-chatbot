name: M13 knowledge responsive patch runner
on:
  push:
    branches: [feat/m13-knowledge-manager-debugger]
    paths: [.github/workflows/m13-knowledge-responsive-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Patch Knowledge responsive structure and CSS
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src-js/index.ts')
          s = p.read_text()
          replacements = [
              (
                  "\t\t\t{ 'data-knowledge-management': 'empty' },",
                  "\t\t\t{\n\t\t\t\tclassName: 'wp-rag-ai-chatbot-knowledge-management',\n\t\t\t\t'data-knowledge-management': 'empty',\n\t\t\t},",
                  'empty Knowledge root',
              ),
              (
                  "\t\t{ 'data-knowledge-management': 'list' },",
                  "\t\t{\n\t\t\tclassName: 'wp-rag-ai-chatbot-knowledge-management',\n\t\t\t'data-knowledge-management': 'list',\n\t\t},",
                  'list Knowledge root',
              ),
          ]
          for old, new, label in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label} match count {count}, expected 1')
              s = s.replace(old, new, 1)
          p.write_text(s)

          css_path = Path('assets/admin.css')
          css = css_path.read_text()
          marker = '#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management {'
          if marker in css:
              raise SystemExit('Knowledge responsive CSS already present')

          responsive = r'''

#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management {
	min-width: 0;
}

#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management > *,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management ul,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management li,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management article,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management section,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management form,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management nav {
	box-sizing: border-box;
	min-width: 0;
	max-width: 100%;
}

#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management a,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management p,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management h2,
#wp-rag-ai-chatbot-admin .wp-rag-ai-chatbot-knowledge-management h3 {
	overflow-wrap: anywhere;
	word-break: break-word;
}

#wp-rag-ai-chatbot-admin [data-knowledge-job-enqueue='true'] {
	display: grid;
	grid-template-columns: minmax(140px, 190px) minmax(0, 1fr);
	gap: 10px 12px;
	align-items: center;
}

#wp-rag-ai-chatbot-admin [data-knowledge-job-enqueue='true'] input {
	box-sizing: border-box;
	width: 100%;
	max-width: 100%;
}

#wp-rag-ai-chatbot-admin [data-knowledge-job-enqueue='true'] > button {
	grid-column: 1 / -1;
	justify-self: start;
	min-height: 40px;
}

#wp-rag-ai-chatbot-admin [data-knowledge-job-action] {
	min-height: 40px;
}

#wp-rag-ai-chatbot-admin [aria-label='Knowledge source pagination'] {
	display: flex;
	flex-wrap: wrap;
	gap: 8px 16px;
	align-items: center;
}

#wp-rag-ai-chatbot-admin [aria-label='Knowledge source pagination'] a {
	display: inline-flex;
	align-items: center;
	min-height: 40px;
}
'''
          media = "@media screen and (max-width: 782px) {"
          if css.count(media) != 1:
              raise SystemExit(f'mobile media match count {css.count(media)}, expected 1')
          css = css.replace(media, responsive + '\n' + media, 1)

          mobile_anchor = "\t#wp-rag-ai-chatbot-admin [data-bot-editor] button,\n\t#wp-rag-ai-chatbot-admin [data-delete-bot-id],\n\t#wp-rag-ai-chatbot-admin [aria-label='Bot list pagination'] a {\n\t\tmin-height: 44px;\n\t}\n"
          if css.count(mobile_anchor) != 1:
              raise SystemExit(f'mobile anchor match count {css.count(mobile_anchor)}, expected 1')
          mobile_knowledge = mobile_anchor + r'''

	#wp-rag-ai-chatbot-admin [data-knowledge-job-enqueue='true'] {
		grid-template-columns: minmax(0, 1fr);
	}

	#wp-rag-ai-chatbot-admin [data-knowledge-job-enqueue='true'] > * {
		grid-column: 1;
	}

	#wp-rag-ai-chatbot-admin [data-knowledge-job-enqueue='true'] button,
	#wp-rag-ai-chatbot-admin [data-knowledge-job-action],
	#wp-rag-ai-chatbot-admin [aria-label='Knowledge source pagination'] a {
		min-height: 44px;
	}
'''
          css = css.replace(mobile_anchor, mobile_knowledge, 1)
          css_path.write_text(css)
          PY
          rm .github/workflows/m13-knowledge-responsive-patch.yml
      - run: npm ci
      - name: Format production patch with repository tooling
        run: |
          npx wp-scripts lint-js src-js/index.ts --fix
          npx prettier --write assets/admin.css
      - name: Verify JavaScript and responsive test contract
        run: npm run verify:js
      - name: Commit verified responsive source
        run: |
          git config user.name 'Salman Butt'
          git config user.email '47062638+salman0butt@users.noreply.github.com'
          git add src-js/index.ts assets/admin.css .github/workflows/m13-knowledge-responsive-patch.yml
          git commit -m 'feat(m13): make knowledge manager responsive'
          git push origin HEAD:feat/m13-knowledge-manager-debugger
