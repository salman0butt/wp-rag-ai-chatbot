name: Task 7 Runtime Refactor Runner

on:
  push:
    branches:
      - feat/m13-knowledge-manager-debugger
    paths:
      - .github/workflows/task7-runtime-refactor.yml

permissions:
  contents: write

jobs:
  apply-runtime-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m13-knowledge-manager-debugger
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/m13-knowledge-manager-debugger
          test "$(git rev-parse origin/feat/m13-knowledge-manager-debugger)" = "$GITHUB_SHA"
      - name: Apply bounded runtime refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src-js/index.ts')
          text = path.read_text()
          replacements = [
              (
                  """import {\n\tPlaygroundRequestDraft,\n\tPlaygroundResult,\n\tPlaygroundScreen,\n} from './playground-screen';""",
                  """import type { PlaygroundControllerState } from './playground-controller';\nimport { PlaygroundPanel } from './playground-panel';\nimport { createPlaygroundRuntime } from './playground-runtime';\nimport type { PlaygroundRequestDraft } from './playground-screen';""",
              ),
              (
                  """\tplaygroundResult?: PlaygroundResult;\n\tplaygroundErrorCode?: string;\n\tonSubmitPlayground?: ( request: PlaygroundRequestDraft ) => void;""",
                  """\tplaygroundState?: PlaygroundControllerState;\n\tonSubmitPlayground?: ( request: PlaygroundRequestDraft ) => void;""",
              ),
              (
                  """\tplaygroundResult,\n\tplaygroundErrorCode,\n\tonSubmitPlayground,""",
                  """\tplaygroundState,\n\tonSubmitPlayground,""",
              ),
              (
                  """\t\t\tPlaygroundScreen( {\n\t\t\t\tresult: playgroundResult,\n\t\t\t\terrorCode: playgroundErrorCode,\n\t\t\t\tonSubmit: onSubmitPlayground,\n\t\t\t} )""",
                  """\t\t\tPlaygroundPanel( {\n\t\t\t\tstate: playgroundState ?? { status: 'idle' },\n\t\t\t\tonSubmit: onSubmitPlayground,\n\t\t\t} )""",
              ),
              (
                  """\tonReplaceProviderCredential?: ( credential: string ) => Promise< void >,\n\tplaygroundResult?: PlaygroundResult,\n\tplaygroundErrorCode?: string,\n\tonSubmitPlayground?: ( request: PlaygroundRequestDraft ) => void""",
                  """\tonReplaceProviderCredential?: ( credential: string ) => Promise< void >,\n\tplaygroundState?: PlaygroundControllerState,\n\tonSubmitPlayground?: ( request: PlaygroundRequestDraft ) => void""",
              ),
              (
                  """\t\t\tplaygroundResult,\n\t\t\tplaygroundErrorCode,\n\t\t\tonSubmitPlayground,""",
                  """\t\t\tplaygroundState,\n\t\t\tonSubmitPlayground,""",
              ),
              (
                  """\tlet currentPlaygroundResult: PlaygroundResult | undefined;\n\tlet currentPlaygroundErrorCode: string | undefined;\n\tlet submitPlayground: (\n\t\trequest: PlaygroundRequestDraft\n\t) => Promise< void > = async () => undefined;""",
                  """\tlet currentPlaygroundState: PlaygroundControllerState = { status: 'idle' };\n\tlet submitPlayground: (\n\t\trequest: PlaygroundRequestDraft\n\t) => Promise< void > = async () => undefined;""",
              ),
              (
                  """\t\t\tcurrentPlaygroundResult,\n\t\t\tcurrentPlaygroundErrorCode,\n\t\t\t( request ) => {""",
                  """\t\t\tcurrentPlaygroundState,\n\t\t\t( request ) => {""",
              ),
              (
                  """\tsubmitPlayground = async (\n\t\trequest: PlaygroundRequestDraft\n\t): Promise< void > => {\n\t\tcurrentPlaygroundResult = undefined;\n\t\tcurrentPlaygroundErrorCode = undefined;\n\t\trenderState( stateFromReadiness() );\n\n\t\ttry {\n\t\t\tcurrentPlaygroundResult = await client.request< PlaygroundResult >(\n\t\t\t\t'/admin/debug/playground',\n\t\t\t\t{\n\t\t\t\t\tmethod: 'POST',\n\t\t\t\t\tbody: request,\n\t\t\t\t}\n\t\t\t);\n\t\t} catch ( error ) {\n\t\t\tcurrentPlaygroundResult = undefined;\n\t\t\tcurrentPlaygroundErrorCode =\n\t\t\t\terror instanceof AdminApiError\n\t\t\t\t\t? error.code\n\t\t\t\t\t: 'playground_failed';\n\t\t}\n\n\t\trenderState( stateFromReadiness() );\n\t};""",
                  """\tconst playgroundRuntime = createPlaygroundRuntime( client, ( state ) => {\n\t\tcurrentPlaygroundState = state;\n\t\trenderState( stateFromReadiness() );\n\t} );\n\tsubmitPlayground = ( request: PlaygroundRequestDraft ): Promise< void > =>\n\t\tplaygroundRuntime.submit( request );""",
              ),
              (
                  """\t\tif ( screen !== 'playground' ) {\n\t\t\tcurrentPlaygroundResult = undefined;\n\t\t\tcurrentPlaygroundErrorCode = undefined;\n\t\t}""",
                  """\t\tif ( screen !== 'playground' ) {\n\t\t\tcurrentPlaygroundState = { status: 'idle' };\n\t\t}""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY
          npx prettier --write src-js/index.ts
          git diff --check
      - name: Verify JavaScript behavior
        run: |
          npm ci
          npm run verify:js
      - name: Commit verified implementation and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/m13-knowledge-manager-debugger
          test "$(git rev-parse origin/feat/m13-knowledge-manager-debugger)" = "$GITHUB_SHA"
          git rm .github/workflows/task7-runtime-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-js/index.ts
          git commit -m "fix: route playground bootstrap through runtime"
          git push origin HEAD:feat/m13-knowledge-manager-debugger
