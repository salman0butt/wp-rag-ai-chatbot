name: M13 knowledge states patch runner
on:
  push:
    branches: [feat/m13-knowledge-manager-debugger]
    paths: [.github/workflows/m13-knowledge-states-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Patch Knowledge loading and error states
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src-js/index.ts')
          s = p.read_text()

          old_loading = """\tif ( state === 'loading' ) {\n\t\treturn createElement(\n\t\t\t'div',\n\t\t\t{ role: 'status', 'aria-live': 'polite' },\n\t\t\t'Loading administration data…'\n\t\t);\n\t}\n"""
          new_loading = """\tif ( state === 'loading' ) {\n\t\tif ( screen === 'knowledge' ) {\n\t\t\treturn createElement(\n\t\t\t\t'div',\n\t\t\t\t{\n\t\t\t\t\trole: 'status',\n\t\t\t\t\t'aria-live': 'polite',\n\t\t\t\t\t'data-knowledge-state': 'loading',\n\t\t\t\t},\n\t\t\t\t'Loading knowledge data…'\n\t\t\t);\n\t\t}\n\n\t\treturn createElement(\n\t\t\t'div',\n\t\t\t{ role: 'status', 'aria-live': 'polite' },\n\t\t\t'Loading administration data…'\n\t\t);\n\t}\n"""
          old_error = """\tif ( state === 'error' ) {\n\t\treturn createElement(\n\t\t\t'div',\n\t\t\t{ role: 'alert' },\n\t\t\t'Administration data could not be loaded.'\n\t\t);\n\t}\n"""
          new_error = """\tif ( state === 'error' ) {\n\t\tif ( screen === 'knowledge' ) {\n\t\t\treturn createElement(\n\t\t\t\t'div',\n\t\t\t\t{ role: 'alert', 'data-knowledge-state': 'error' },\n\t\t\t\t'Knowledge data could not be loaded.'\n\t\t\t);\n\t\t}\n\n\t\treturn createElement(\n\t\t\t'div',\n\t\t\t{ role: 'alert' },\n\t\t\t'Administration data could not be loaded.'\n\t\t);\n\t}\n"""

          for old, new, label in [
              (old_loading, new_loading, 'loading'),
              (old_error, new_error, 'error'),
          ]:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label} match count {count}, expected 1')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          rm .github/workflows/m13-knowledge-states-patch.yml
      - run: npm ci
      - name: Format production patch with repository rules
        run: npx wp-scripts lint-js src-js/index.ts --fix
      - name: Verify JavaScript
        run: npm run verify:js
      - name: Commit verified source
        run: |
          git config user.name 'Salman Butt'
          git config user.email '47062638+salman0butt@users.noreply.github.com'
          git add src-js/index.ts .github/workflows/m13-knowledge-states-patch.yml
          git commit -m 'feat(m13): add explicit knowledge loading and error states'
          git push origin HEAD:feat/m13-knowledge-manager-debugger
