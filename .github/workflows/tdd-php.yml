name: TDD PHP

on:
  push:
    branches:
      - feat/m01-foundation-tooling

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          extensions: dom, filter, json, libxml, mbstring, tokenizer, xml, xmlreader, xmlwriter
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Measure generated Composer lockfile
        run: |
          wc -lc composer.lock
          jq -c . composer.lock | wc -c
      - run: composer test -- --filter 'PluginEntryPointTest|BootstrapTest'
      - run: composer lint:php
      - run: composer analyse
